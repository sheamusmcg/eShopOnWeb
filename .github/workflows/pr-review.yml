# .github/workflows/pr-review.yml
#
# Session 2 reference PR-review workflow (known-good).
# This is the tested reference the lab's Block 5 builds toward. It is the
# official "Run a skill" example from the Claude Code GitHub Actions docs,
# with the prompt extended to name docs/spec.md and REVIEW.md and a
# --max-turns cap added (both annotated below). Supply it
# so the exercise works even when a participant's generated version doesn't.
#
# WHERE TO COMMIT: your fork's main branch, before opening the PR. The PR's
# 'opened' event only runs workflows that already exist, and keeping this file
# off the flawed branch keeps it out of the PR diff.
#
# WHAT IT DOES: on every (non-draft) pull request, installs the official
# code-review plugin and runs it, posting findings on the PR — an inline
# comment per issue, or one summary comment when it finds none.
#
# REVIEW-AGAINST-STANDARD: the code-review plugin collects CLAUDE.md (root, and
# any in changed-file directories) and checks the diff against it. It does NOT
# auto-discover REVIEW.md, coverage, or a four-pass method. So to review against
# YOUR standard you must either (a) put the rules in CLAUDE.md, which the plugin
# reads, or (b) name REVIEW.md explicitly in the prompt, as the prompt below does
# (and ideally both). The same applies to docs/spec.md: the plugin won't check
# the diff against the requirements unless the prompt names the file. Left to itself the plugin flags only compile/parse errors,
# definite wrong-results bugs, and clear CLAUDE.md violations — a binary filter,
# no severity. The four passes, severity, and coverage come from your prompt and
# CLAUDE.md, not from the plugin's defaults.
#
# COMMENTS, DOESN'T GATE: this posts findings; it does NOT block a merge.
# To gate on severity counts, the lab appendix recipe parses the MANAGED Code
# Review check run (a different mechanism — the Claude GitHub App — which emits a
# machine-readable severity line). This plugin's own output has no such line, so
# gate this workflow by other means (e.g. fail the job on your fresh-session
# pass's verdict) and make it a required status check via branch protection.
#
# AUTH: the example authenticates with the Claude API key. Set ONE secret and
# use the matching input:
#   ANTHROPIC_API_KEY        -> anthropic_api_key        (shown below)
#   CLAUDE_CODE_OAUTH_TOKEN  -> claude_code_oauth_token  (subscription token
#                               from `claude setup-token`)
# In a governed shop, use your approved secret route and name the exact secret
# to participants.

name: Code Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write          # required for the action's default GitHub App auth
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # --comment posts the review on the PR (inline per issue, or one summary
          # when none). Without it, findings go only to the workflow run log.
          prompt: >
            /code-review:code-review
            --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
            Also read docs/spec.md and REVIEW.md. Check the diff against the
            acceptance criteria in docs/spec.md and cite the criterion for any
            violation. Apply REVIEW.md as the team standard: run its four passes
            (intent, design, implementation, tests), rank each finding by its
            severity scale, and flag anything in the high-risk categories. Both
            files are explicit inputs here; the plugin does not read either on its own.
          # Keep this line even though the skill's own allowed-tools names the same
          # tool: the action starts the inline-comment MCP server only when
          # --allowedTools in claude_args names it.
          #
          # ADDED (not in the stock example): --max-turns caps the run so a large
          # diff can't run away on cost. Documented as valid in claude_args.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment" --max-turns 15'
